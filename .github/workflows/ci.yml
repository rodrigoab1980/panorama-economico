name: CI

# Roda os testes em todo PR e em cada push na main (o badge do README mostra o estado da main).
# Não publica nada e não usa segredos.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 24: versão do workflow de atualização e mínimo do package.json; 26: LTS mais nova.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

      # Build quebrado reprova o PR (o site publicado é o dist/).
      - run: npm run build
