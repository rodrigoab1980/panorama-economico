name: Atualizar panorama

on:
  # O gatilho principal é externo: o cron-job.org chama a API do GitHub (workflow_dispatch) a cada 15 min.
  # Veja "Atualização confiável" no README. O schedule abaixo fica de reserva, para quando o cron-job.org falhar.
  schedule:
    # A cada 15 min, de segunda a sexta, das 06:07 às 20:52 de Brasília (09–23 UTC).
    # Minutos "quebrados" para fugir dos horários cheios (:00, :15...), em que o GitHub mais descarta execuções agendadas.
    - cron: "7,22,37,52 9-23 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      forcar_resumo:
        description: "Gerar um novo resumo da IA agora"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read   # a guarda consulta as execuções recentes deste workflow

jobs:
  # Execução agendada (reserva) pula se o cron-job.org já disparou o workflow nos últimos 15 min (o externo roda em :00/:15/:30/:45; o reserva, em :07/:22/:37/:52).
  # Fica fora da concurrency abaixo: se ficasse dentro, a agendada cancelaria a externa antes de decidir pular.
  guarda:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      pular: ${{ steps.guarda.outputs.pular }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: guarda
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/guarda.mjs

  atualizar:
    needs: guarda
    # Roda sempre, exceto quando a guarda (só nas agendadas) mandou pular. `always()` porque a guarda
    # é pulada nos outros eventos; se ela falhar, não há "pular=true" e a atualização roda.
    if: always() && needs.guarda.outputs.pular != 'true'
    runs-on: ubuntu-latest
    # Uma atualização por vez; a nova cancela a anterior se ela ficar presa (ex.: aguardando o ambiente do Pages).
    concurrency:
      group: panorama
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Histórico e resumos arquivados ficam na branch `dados`, não na `main` (assim a `main` pode ser protegida).
      # Nenhum destes passos derruba o deploy: sem a branch, o site sai igual, só sem as variações de semana e mês.
      - name: Baixar o histórico (branch dados)
        id: baixar_dados
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: dados
          path: dados

      # Só na primeira vez (a branch ainda não existe): cria `dados` vazia, sem os arquivos da main.
      - name: Criar a branch dados
        if: steps.baixar_dados.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          path: dados
      - name: Esvaziar a branch dados nova
        if: steps.baixar_dados.outcome == 'failure'
        continue-on-error: true
        working-directory: dados
        run: |
          git checkout --orphan dados
          git rm -rfq .

      - name: Coletar dados e gerar resumo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SUMMARY_INTERVAL_MIN: ${{ vars.SUMMARY_INTERVAL_MIN || '60' }}
          # Alertas de movimento fora do padrão; vazio usa o padrão do código (2.5, 3 e 15).
          ALERTA_DESVIOS: ${{ vars.ALERTA_DESVIOS }}
          ALERTA_PCT: ${{ vars.ALERTA_PCT }}
          ALERTA_BPS: ${{ vars.ALERTA_BPS }}
          FORCAR_RESUMO: ${{ inputs.forcar_resumo && '1' || '' }}
        run: node scripts/update.mjs

      # A partir das 19h: grava o fechamento do dia e o resumo arquivado na branch `dados`.
      - name: Gravar histórico (branch dados)
        continue-on-error: true
        working-directory: dados
        run: |
          # Sem checkout próprio aqui, o git subiria até o repositório da main: não grava nada.
          [ -d .git ] || { echo "sem a branch dados; nada gravado"; exit 0; }
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "dados: fechamento de $(TZ=America/Sao_Paulo date +%F)"
            git push origin HEAD:dados
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
