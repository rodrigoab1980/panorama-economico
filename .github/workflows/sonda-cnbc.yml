name: Sonda CNBC (temporário)
on:
  push:
    branches: [ccr-8662241c-c4ftxr]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/update.mjs
      - run: |
          python3 - <<'PY'
          import json
          d = json.load(open("site/data/mapa.json"))
          for k, l in d["mapas"].items():
              print(k, len(l), "ações; sem valor de mercado:", [a["ticker"] for a in l if not a["valor_mercado"]])
          print("IBOV:", [(a["ticker"], a["tamanho"]) for a in d["mapas"]["IBOV"]])
          PY
          U='https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?requestMethod=itv&noform=1&partnerId=2&output=json&symbols='
          curl -sS -A 'Mozilla/5.0' "${U}ABEV3-BR|AXIA3-BR|ELET3-BR" | python3 -c "import json,sys; [print(q.get('symbol'), q.get('code'), q.get('last'), q.get('name')) for q in json.load(sys.stdin)['FormattedQuoteResult']['FormattedQuote']]"
          python3 - <<'PY'
          import json
          print("MAPA_JSON_INICIO"); print(json.dumps(json.load(open("site/data/mapa.json")), separators=(",", ":"))); print("MAPA_JSON_FIM")
          PY
