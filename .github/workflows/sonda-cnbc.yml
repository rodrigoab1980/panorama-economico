name: Sonda CNBC (temporário)
on:
  push:
    branches: [ccr-8662241c-c4ftxr]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/update.mjs
      - run: |
          python3 - <<'PY'
          import json
          d = json.load(open("site/data/mapa.json"))
          for k, l in d["mapas"].items():
              print(k, len(l), "ações; sem valor de mercado:", [a["ticker"] for a in l if not a["valor_mercado"]])
          print("MAPA_JSON_INICIO"); print(json.dumps(d, separators=(",", ":"))); print("MAPA_JSON_FIM")
          PY
